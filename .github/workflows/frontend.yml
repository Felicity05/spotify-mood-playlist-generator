name: Deploy Frontend

on:
  push:
    branches:
      - main
    tags:
      - latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, '[frontend]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd client
          rm -rf node_modules
          yarn cache clean
          yarn 
          yarn install

      - name: Log environment variables before build
        run: |
          echo "REACT_APP_REDIRECT_URI=${{ secrets.REDIRECT_URI_PROD }}"
          echo "REACT_APP_PREDICTIONS_ENDPOINT=${{ secrets.PREDICTIONS_ENDPOINT_PROD }}"

      - name: Build frontend
        env:
          REACT_APP_REDIRECT_URI=${{ secrets.REDIRECT_URI_PROD }}
          REACT_APP_PREDICTIONS_ENDPOINT=${{ secrets.PREDICTIONS_ENDPOINT_PROD }}
        run: |
          cd client
          CI=false yarn build --verbose

      - name: Check build output
        run: |
          cd client
          if [ -d "build" ]; then echo "Build directory exists"; else echo "Build directory does not exist"; fi
          ls -la build || true

      - name: Check built files
        run: |
          cd client
          if [ -d "build" ]; then
            grep -r 'REACT_APP_REDIRECT_URI' build/
            grep -r 'REACT_APP_PREDICTIONS_ENDPOINT' build/
          else echo "Build directory does not exist"; fi

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          aws s3 sync client/build s3://spotify-mood-generator-playlist --delete

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          aws cloudfront create-invalidation --distribution-id E3G2CAP3BH2C9V --paths "/*"
